{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - JAAP</title>
    <link rel="stylesheet" href="{% static 'css/login.css' %}">
</head>
<body>
    <canvas id="bg-canvas"></canvas>

    <div class="login-overlay">
        <div class="login-card">
            <div class="logo">JAAP.</div>
            <h2>Acceso al Sistema Logístico</h2>
            
            <form id="loginForm" method="POST" action="{% url 'login' %}">
                {% csrf_token %} 
                
                <div class="form-field">
                    <label for="loginUser">Usuario</label>
                    <input type="text" id="loginUser" name="username" placeholder="Ej. joshua" required>
                </div>
                
                <div class="form-field">
                    <label for="loginPass">Contraseña</label>
                    <input type="password" id="loginPass" name="password" placeholder="••••••••" required>
                </div>
                
                <button type="submit" class="submit-btn">Ingresar al Sistema</button>

                {% if messages %}
                    <div class="messages-container" style="margin-top: 15px;">
                        {% for message in messages %}
                            <p class="error-msg" style="display: block; color: #ff4d4d; font-size: 0.9rem; text-align: center;">
                                {{ message }}
                            </p>
                        {% endfor %}
                    </div>
                {% endif %}
            </form>
        </div>
    </div>

    <script src="{% static 'js/login.js' %}"></script>
</body>
</html>
